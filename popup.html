<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #222;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 13px;
    }
    input[type="text"]:focus { outline: none; border-color: #E53935; }
    .hint { color: #777; font-size: 11px; line-height: 1.5; margin: 8px 0 14px; }
    .hint code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    button {
      width: 100%;
      padding: 8px;
      background: #E53935;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #d32f2f; }
    #status { text-align: center; color: #E53935; font-size: 12px; height: 16px; margin-top: 8px; }
    .usage { color: #555; font-size: 11px; margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1 data-i18n="popupHeading"></h1>

  <label for="subfolder" data-i18n="subfolderLabel"></label>
  <input type="text" id="subfolder" data-i18n-ph="subfolderPlaceholder">
  <div class="hint" data-i18n-html="subfolderHint"></div>

  <button id="save" data-i18n="saveButton"></button>
  <div id="status"></div>

  <div class="usage" data-i18n="usage"></div>

  <script src="popup.js"></script>
</body>
</html>
